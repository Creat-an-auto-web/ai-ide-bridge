<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">需求分析阶段三智能体架构图</title>
  <desc id="desc">全中文架构图，展示需求分析阶段由故事生成、单条验证、组合验证三个智能体构成，并通过生成与验证闭环产出结果。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#e9f2ff" stroke-width="1"/>
      <path d="M 12 0 L 12 24 M 0 12 L 24 12" fill="none" stroke="#f4f9ff" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="0.75" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.75 0.9 L 5.25 3 L 0.75 5.1 z" fill="#0c5cad"/>
    </marker>
    <style>
      .title { font: 700 28px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #ffffff; }
      .lane { font: 700 18px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #ffffff; }
      .big { font: 700 24px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #08345f; }
      .mid { font: 700 18px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #08345f; }
      .text { font: 600 16px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #0d3b66; }
      .white { font: 700 16px "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", sans-serif; fill: #ffffff; }
      .arrow { stroke: #0c5cad; stroke-width: 4; fill: none; marker-end: url(#arrow); stroke-linejoin: round; stroke-linecap: round; }
      .line { stroke: #0c5cad; stroke-width: 4; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#fbfdff"/>
  <rect width="1800" height="1080" fill="url(#grid)"/>

  <rect x="455" y="34" width="890" height="76" rx="8" fill="#4aa3f0"/>
  <text x="900" y="82" class="title" text-anchor="middle">需求分析阶段三智能体架构</text>

  <rect x="70" y="160" width="160" height="58" rx="2" fill="#b772f2"/>
  <text x="150" y="197" class="lane" text-anchor="middle">输入</text>
  <rect x="70" y="340" width="160" height="58" rx="2" fill="#b772f2"/>
  <text x="150" y="377" class="lane" text-anchor="middle">生成</text>
  <rect x="70" y="560" width="160" height="58" rx="2" fill="#b772f2"/>
  <text x="150" y="597" class="lane" text-anchor="middle">验证</text>
  <rect x="70" y="820" width="160" height="58" rx="2" fill="#b772f2"/>
  <text x="150" y="857" class="lane" text-anchor="middle">结果</text>

  <rect x="340" y="148" width="1120" height="86" rx="8" fill="#97cdfb"/>
  <rect x="410" y="169" width="180" height="44" rx="4" fill="#238fe8"/>
  <text x="500" y="197" class="white" text-anchor="middle">原始需求</text>
  <rect x="610" y="169" width="180" height="44" rx="4" fill="#238fe8"/>
  <text x="700" y="197" class="white" text-anchor="middle">项目上下文</text>
  <rect x="810" y="169" width="180" height="44" rx="4" fill="#238fe8"/>
  <text x="900" y="197" class="white" text-anchor="middle">模型配置</text>
  <rect x="1010" y="169" width="180" height="44" rx="4" fill="#238fe8"/>
  <text x="1100" y="197" class="white" text-anchor="middle">环境配置</text>
  <rect x="1210" y="169" width="180" height="44" rx="4" fill="#238fe8"/>
  <text x="1300" y="197" class="white" text-anchor="middle">用户反馈</text>

  <path d="M 900 234 L 900 300" class="arrow"/>

  <rect x="530" y="318" width="740" height="150" rx="10" fill="#fff8c4" stroke="#f4cf58" stroke-width="3"/>
  <text x="900" y="360" class="big" text-anchor="middle">故事生成智能体</text>
  <rect x="610" y="388" width="260" height="42" rx="20" fill="#ffc88f" stroke="#0b2948" stroke-width="3"/>
  <text x="740" y="415" class="mid" text-anchor="middle">生成需求结构</text>
  <rect x="930" y="388" width="260" height="42" rx="20" fill="#ffc88f" stroke="#0b2948" stroke-width="3"/>
  <text x="1060" y="415" class="mid" text-anchor="middle">拆分中文故事</text>

  <path d="M 700 468 L 700 510" class="arrow"/>
  <path d="M 1100 468 L 1100 510" class="arrow"/>

  <rect x="500" y="528" width="360" height="150" rx="10" fill="#fff8c4" stroke="#f4cf58" stroke-width="3"/>
  <text x="680" y="568" class="big" text-anchor="middle">单条验证智能体</text>
  <rect x="550" y="596" width="260" height="42" rx="20" fill="#ffc88f" stroke="#0b2948" stroke-width="3"/>
  <text x="680" y="623" class="mid" text-anchor="middle">检查故事质量</text>

  <rect x="940" y="528" width="360" height="150" rx="10" fill="#fff8c4" stroke="#f4cf58" stroke-width="3"/>
  <text x="1120" y="568" class="big" text-anchor="middle">组合验证智能体</text>
  <rect x="990" y="596" width="260" height="42" rx="20" fill="#ffc88f" stroke="#0b2948" stroke-width="3"/>
  <text x="1120" y="623" class="mid" text-anchor="middle">检查业务闭环</text>

  <path d="M 620 510 L 620 486" class="arrow"/>
  <path d="M 1220 510 L 1220 486" class="arrow"/>
  <path d="M 860 603 L 922 603" class="arrow"/>
  <path d="M 1120 678 L 1120 748" class="arrow"/>

  <rect x="340" y="766" width="1120" height="110" rx="8" fill="#97cdfb"/>
  <rect x="420" y="798" width="260" height="48" rx="4" fill="#238fe8"/>
  <text x="550" y="829" class="white" text-anchor="middle">用户故事</text>
  <rect x="770" y="798" width="260" height="48" rx="4" fill="#238fe8"/>
  <text x="900" y="829" class="white" text-anchor="middle">故事依赖图</text>
  <rect x="1120" y="798" width="260" height="48" rx="4" fill="#2dbd73"/>
  <text x="1250" y="829" class="white" text-anchor="middle">进入测试用例生成</text>

</svg>
